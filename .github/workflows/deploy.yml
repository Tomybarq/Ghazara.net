name: CI/CD Pipeline - Prisma Migrations & Google Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REGION: ${{ secrets.GCP_REGION || 'me-central1' }}
  GAR_REPOSITORY: ${{ secrets.GCP_GAR_REPOSITORY || 'ghazara-apps' }}
  SERVICE_NAME: ${{ secrets.GCP_CLOUDRUN_SERVICE || 'ghazara-sales-app' }}
  IMAGE_NAME: ghazara-sales-app

jobs:
  # ----------------------------------------------------------------------------
  # 1. Quality & Test Gate
  # ----------------------------------------------------------------------------
  quality-gate:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Domain Tests
        run: npm run test

      - name: Lint
        run: npm run lint

  # ----------------------------------------------------------------------------
  # 2. Database Migration & Drift Gate
  # ----------------------------------------------------------------------------
  migration-gate:
    name: Prisma Schema Drift Check & Migration Deploy
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Drift Gate: Verify zero drift between migrations and schema.prisma
      - name: Prisma Schema Drift Gate
        if: env.SHADOW_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      # Deploy Migrations against Supabase Session Pooler (port 5432) BEFORE container deployment
      - name: Run Prisma Migration Deploy (Session Pooler :5432)
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "Applying pending migrations against Supabase Session Pooler (:5432)..."
          npx prisma migrate deploy

  # ----------------------------------------------------------------------------
  # 3. Build & Deploy to Cloud Run
  # ----------------------------------------------------------------------------
  deploy-cloud-run:
    name: Build Image & Deploy to Cloud Run
    needs: migration-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Production Multi-Stage Container
        env:
          IMAGE_TAG: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          LATEST_TAG: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          docker build -t $IMAGE_TAG -t $LATEST_TAG .
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      # Deploy new revision with Secret Manager bindings (Least Privilege Service Account)
      - name: Deploy Revision to Cloud Run
        env:
          IMAGE_TAG: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $IMAGE_TAG \
            --region ${{ env.GAR_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,VITE_SUPABASE_URL=VITE_SUPABASE_URL:latest,VITE_SUPABASE_ANON_KEY=VITE_SUPABASE_ANON_KEY:latest"
